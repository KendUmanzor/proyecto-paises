<div
   class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs overflow-y-auto"
   (click)="cerrar.emit()"
>
   <div
      class="relative w-full max-w-4xl bg-[#F3F4F6] rounded-2xl shadow-2xl p-6 sm:p-8 max-h-[90vh] overflow-y-auto my-auto"
      (click)="$event.stopPropagation()"
   >
      <div class="flex items-center justify-between mb-6">
         <button
            type="button"
            (click)="cerrar.emit()"
            class="inline-block px-4 py-2 rounded-lg border border-gray-300 bg-white text-gray-700 hover:bg-gray-100 cursor-pointer font-medium"
         >
            ← Volver a países
         </button>
         <button
            type="button"
            (click)="cerrar.emit()"
            class="text-gray-400 hover:text-gray-600 rounded-lg p-1.5 hover:bg-gray-200 transition cursor-pointer"
            aria-label="Cerrar modal"
         >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
               <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
         </button>
      </div>

      @if (cargando()) {
         <div class="text-center py-16">
            <img src="https://media.tenor.com/zRg95-LgG9UAAAAM/smw-mario.gif" alt="Cargando" class="mx-auto h-32 w-auto mb-3" />
            <p class="text-lg font-medium">Cargando detalles de {{ paisApi.obtenerNombrePais(paisActual()) || 'país' }}...</p>
         </div>
      }

      @if (error()) {
         <div class="max-w-md mx-auto bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg text-center my-6">
            <p>{{ error() }}</p>
         </div>
      }

      @if (paisActual(); as p) {
         <app-pais-info
            [pais]="p"
            (verClima)="irAClima($event)"
            (verVecino)="irADetalle($event)"
         />
      }
   </div>
</div>
