@if (totalPaginas > 1) {
   <nav class="flex flex-wrap items-center justify-center gap-2 mt-2" aria-label="Paginación">
      <button
         type="button"
         class="px-4 py-2 rounded-lg border border-gray-300 bg-white text-gray-700 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed"
         [disabled]="paginaActual === 1"
         (click)="ir(paginaActual - 1)"
      >
         Anterior
      </button>

      @for (p of paginasVisibles; track $index) {
         @if (p === '...') {
            <span class="px-2 text-gray-400">…</span>
         } @else {
            <button
               type="button"
               class="min-w-10 px-3 py-2 rounded-lg border"
               [class]="p === paginaActual
                  ? 'bg-indigo-600 border-indigo-600 text-white font-semibold'
                  : 'bg-white border-gray-300 text-gray-700 hover:bg-gray-100'"
               [attr.aria-current]="p === paginaActual ? 'page' : null"
               (click)="ir(p)"
            >
               {{ p }}
            </button>
         }
      }

      <button
         type="button"
         class="px-4 py-2 rounded-lg border border-gray-300 bg-white text-gray-700 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed"
         [disabled]="paginaActual === totalPaginas"
         (click)="ir(paginaActual + 1)"
      >
         Siguiente
      </button>
   </nav>
}
