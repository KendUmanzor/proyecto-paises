<div class="relative w-full max-w-xl mx-auto px-4 py-4">
  <div class="relative text-gray-600">
    <input
      type="search"
      [value]="apiService.terminoBusqueda()"
      (input)="onInput($event)"
      (focus)="onFocus()"
      placeholder="Escribe una letra "
      autocomplete="off"
      class="w-full bg-white text-gray-800 placeholder-gray-400 h-12 pl-12 pr-10 rounded-full text-sm font-medium border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all shadow-sm"
    />

    <div class="absolute left-4 top-3.5 text-gray-400 pointer-events-none">
      <svg class="h-5 w-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56.966 56.966">
        <path d="M55.146,51.887L41.588,37.786c3.486-4.144,5.396-9.358,5.396-14.786c0-12.682-10.318-23-23-23s-23,10.318-23,23 s10.318,23,23,23c4.761,0,9.298-1.436,13.177-4.162l13.661,14.208c0.571,0.593,1.339,0.92,2.162,0.92 c0.779,0,1.518-0.297,2.079-0.837C56.255,54.982,56.293,53.08,55.146,51.887z M23.984,6c9.374,0,17,7.626,17,17s-7.626,17-17,17 s-17-7.626-17-17S14.61,6,23.984,6z"/>
      </svg>
    </div>

    @if (apiService.terminoBusqueda()) {
      <button
        type="button"
        (click)="limpiarBusqueda()"
        class="absolute right-3.5 top-3.5 text-gray-400 hover:text-gray-600 p-0.5 rounded-full hover:bg-gray-100 transition cursor-pointer"
        title="Borrar búsqueda"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    }
  </div>

  @if (mostrarRecomendaciones() && recomendaciones().length === 0 && apiService.terminoBusqueda().trim().length > 0) {
    <div class="absolute left-4 right-4 top-full mt-1 bg-white rounded-2xl shadow-xl border border-gray-200 p-4 text-center z-50 text-gray-500 text-sm">
      No se encontraron países que comiencen con "<strong>{{ apiService.terminoBusqueda() }}</strong>"
    </div>
  }
</div>
